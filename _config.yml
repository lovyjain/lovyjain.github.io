# ============================================================
# Site Settings
# ============================================================
title                  : "Lovy Jain"
title_separator        : "—"
subtitle               : "Technical Architect & AI Solutions Specialist"
name                   : "Lovy Jain"
description            : "Enterprise Technical Architect with 13+ years building AI-integrated, cloud-native, and CRM-led solutions for Fortune 500 clients. Specialising in Azure AI, Dynamics 365, Power Platform, and Business Messaging."
url                    : "https://lovyjain.github.io"
baseurl                : ""
repository             : "lovyjain/lovyjain.github.io"
logo                   : # "/assets/images/logo.png"
masthead_title         : "Lovy Jain"
breadcrumbs            : false
words_per_minute       : 200
enable_copy_code_button: true

# ============================================================
# Theme
# ============================================================
remote_theme           : "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin  : "dark"   # "default" | "air" | "aqua" | "contrast" | "dark" | "dirt" | "neon" | "mint" | "plum" | "sunrise"

# ============================================================
# Author Profile
# ============================================================
author:
  name    : "Lovy Jain"
  avatar  : "/assets/images/avatar.jpg"
  bio     : >
    Enterprise Technical Architect & AI Solutions Specialist.
    13+ years delivering AI, CRM, and cloud-native solutions for Fortune 500 clients.
    Building **[JainKwiz](https://jainkwiz.com)** on the side.
  location: "Delhi-NCR, India"
  email   : "lovyjain18@gmail.com"
  links:
    - label : "LinkedIn"
      icon  : "fab fa-fw fa-linkedin"
      url   : "https://linkedin.com/in/jainlovy"
    - label : "JainKwiz"
      icon  : "fas fa-fw fa-globe"
      url   : "https://jainkwiz.com"
    - label : "Email"
      icon  : "fas fa-fw fa-envelope"
      url   : "mailto:lovyjain18@gmail.com"
    - label : "Phone"
      icon  : "fas fa-fw fa-phone"
      url   : "tel:+919711245951"

# ============================================================
# Footer
# ============================================================
footer:
  links:
    - label : "LinkedIn"
      icon  : "fab fa-fw fa-linkedin"
      url   : "https://linkedin.com/in/jainlovy"
    - label : "JainKwiz"
      icon  : "fas fa-fw fa-globe"
      url   : "https://jainkwiz.com"
    - label : "GitHub"
      icon  : "fab fa-fw fa-github"
      url   : "https://github.com/lovyjain"

# ============================================================
# Collections & Includes
# ============================================================
include:
  - _pages

permalink    : /:categories/:title/
paginate     : 6
paginate_path: /blog/page:num/
timezone     : "Asia/Kolkata"

# ============================================================
# Jekyll Plugins
# ============================================================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-paginate

# ============================================================
# Front Matter Defaults
# ============================================================
defaults:
  # Posts
  - scope:
      path: ""
      type: posts
    values:
      layout         : single
      author_profile : true
      read_time      : true
      share          : true
      show_date      : true
      related        : true
      comments       : false

  # Pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout         : single
      author_profile : true

# ============================================================
# SEO / Social
# ============================================================
og_image: "/assets/images/og-image.jpg"

social:
  type : Person
  name : "Lovy Jain"
  links:
    - "https://linkedin.com/in/jainlovy"
    - "https://jainkwiz.com"

